[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rivalforge"
version = "0.1.0"
description = "A sixty-second NFT duelling game."
requires-python = ">=3.11"
# The engine has no runtime dependencies, on purpose. Every dependency is
# supply-chain surface, and a game whose core is pure stdlib can be audited in
# an afternoon. Network and storage phases will add theirs behind extras.
dependencies = []

[project.optional-dependencies]
# Wallet authentication. Ed25519 verification is delegated to libsodium via
# PyNaCl -- hand-rolled curve arithmetic is how signature-verification bugs get
# written, and a verifier that accepts a forgery is worse than none.
auth = [
  "PyNaCl>=1.5",
]
# Durable storage. Optional: the engine and the CLI run without a database,
# and a deployment that does not persist anything never loads a driver.
postgres = [
  "psycopg[binary]>=3.1",
]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "PyNaCl>=1.5",
  "psycopg[binary]>=3.1",
]

[project.scripts]
rivalforge = "rivalforge.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rivalforge.content" = ["data/*.json"]
"rivalforge.store" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -q keeps CI output readable; --strict-markers stops a typo'd marker silently
# skipping a test, which is the quiet failure mode that hid bugs in the
# previous codebase.
addopts = "-q --strict-markers -m 'not integration'"
markers = [
  "integration: needs the network; run with `pytest -m integration`",
]
